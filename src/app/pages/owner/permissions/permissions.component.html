<div class="content">
    <div class="page-header">
        <div class="add-item d-flex">
            <div class="page-title">
                <h4>Permisions</h4>
                <h6>Manage user permission</h6>
            </div>
        </div>
        <ul class="table-top-head">
            
        </ul>
        <div class="page-btn">
            <button class="btn btn-added" data-bs-toggle="modal" data-bs-target="#new-units"><i
                    data-feather="plus-circle" class="me-2"></i> Create New Permission</button>
        </div>
    </div>

    <div class="card table-list-card">
        <div class="card-body">
            <div class="table-top">
                <div class="search-set">
                    <div class="search-input">
                        <a href class="btn btn-searchset"><i data-feather="search" class="feather-search"></i></a>
                    </div>
                </div>
            </div>

            <div style="display: flex;justify-content:center;">
                <app-errormodal></app-errormodal>
            </div>

            <div class="card" id="filter_inputs">
                <div class="card-body pb-0">
                    
                </div>
            </div>

            <div class="table-responsive">
                <div *ngIf="!(users$ | async); else permissionsTable">
                    Loading...
                  </div>
                <ng-template #permissionsTable>
                    <table class="table datapermissions">
                        <thead>
                            <tr>
                                <th class="no-sort">
                                    <label class="checkboxs">
                                        <input type="checkbox" id="select-all">
                                        <span class="checkmarks"></span>
                                    </label>
                                </th>
                                <th>permissions Name</th>
                                <th>Business Name</th>
                                <th>email</th>
                                <th *ngIf="role == 'Business_Owner'" class="no-sort">Action</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr *ngFor="let permission of permissions">
                                <td>
                                    <label class="checkboxs">
                                        <input type="checkbox">
                                        <span class="checkmarks"></span>
                                    </label>
                                </td>
                                <td>{{permission.name}}</td>
                                <td>{{permission.business_name}}</td>
                                <td>{{permission.email}}</td>
                                <td>
                                    <span style="display: flex;justify-content: center;font-size: 22px;" class="text-center">
                                        <i *ngIf="permission.is_credit_allowed == 1" data-feather="check" class="feather-check text-success"></i>
                                        <i *ngIf="permission.is_credit_allowed == 0" data-feather="x" class="feather-x text-danger "></i>
                                    </span>
                                </td>
                                <td *ngIf="role == 'Business_Owner'" class="action-table-data">
                                    <div class="edit-delete-action">
                                        <!-- <a title="Update credit worthiness" class="me-2 p-2 mb-0" href="javascript:void(0);">
                                            <i data-feather="trash-2" class="feather-trash-2">
                                            </i>
                                        </a> -->
                                        <a class="me-2 p-2 mb-0" data-bs-toggle="modal" data-bs-target="#edit-units">
                                            <i data-feather="edit" class="feather-edit"></i>
                                        </a>
                                        <!-- <a class="me-2 confirm-text p-2 mb-0" href="javascript:void(0);" data-bs-toggle="modal" data-bs-target="#delete-units">
                                            <i data-feather="trash-2" class="feather-trash-2">
                                                <img src="assets/images/trash-solid.svg">
                                            </i>
                                        </a> -->
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </ng-template>
                <div class="info"></div>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="new-units">
    <div class="modal-dialog modal-dialog-centered custom-modal-two">
        <div class="modal-content">
            <div class="page-wrapper-new p-0">
                <div class="content">
                    <div class="modal-header border-0 custom-modal-header">
                        <div class="page-title">
                            <h4>New Branch Info</h4>
                        </div>
                        <button type="button" class="close" data-bs-dismiss="modal" aria-label="Close">
                            <span aria-hidden="true">&times;</span>
                        </button>
                    </div>
                    <div class="modal-body custom-modal-body">
                        <form>
                            <div class="row">
                                <div class="col-lg-12">
                                    
                                </div>
                                <div class="col-lg-6">
                                    <div class="input-blocks">
                                        <label>Branch Code</label>
                                        <input type="text" placeholder="">
                                    </div>
                                    <div style="color:red" >
                                        <div class="forgot-link" style="font-size: 12px;font-weight: 500;" >Branch code is required.</div>
                                    </div>
                                </div>
                                <div class="col-lg-6">
                                    <div class="input-blocks">
                                        <label>Branch Name</label>
                                        <input type="text" placeholder="">
                                    </div>
                                    <div style="color:red">
                                        <div class="forgot-link" style="font-size: 12px;font-weight: 500;">Branch name is required.</div>
                                    </div>
                                </div>
                                <div class="col-lg-6">
                                    <div class="input-blocks">
                                        <label>Location</label>
                                        <input type="text" placeholder="">
                                    </div>
                                    <div style="color:red">
                                        <div class="forgot-link" style="font-size: 12px;font-weight: 500;">Location is required.</div>
                                    </div>
                                </div>
                                
                                <div class="col-lg-6">
                                    <div class="input-blocks">
                                        <label>Manager</label>
                                         <select class="form-control" >
                                            <option *ngFor="let user of users$ | async" [value]="user.id">{{ user.name }}</option>
                                         </select>
                                    </div>
                                    <div style="color:red">
                                        <div class="forgot-link" style="font-size: 12px;font-weight: 500;" >Manager is required.</div>
                                    </div>
                                </div>
                            </div>
                            <div style="display: flex;justify-content:center;">
                                <app-errormodal></app-errormodal>
                            </div>
                            <div class="modal-footer-btn">
                                <button [disabled]="sharedservice.responses.disabled"  type="button" class="btn btn-cancel me-2"
                                    data-bs-dismiss="modal">Cancel</button>
                                <button [disabled]="sharedservice.responses.disabled"  type="submit" class="btn btn-submit">Submit</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
