<div class="card table-list-card">
    <div class="card-body">
        <div class="table-top">
            <div class="search-set">
                <div class="search-input">
                    <a href class="btn btn-searchset"><i data-feather="search" class="feather-search"></i></a>
                </div>
            </div>            
        </div>

        <div style="display: flex;justify-content:center;">
            <app-errormodal></app-errormodal>
        </div>
        <div class="table-responsive">
            <table class="table dataexpcat">
                <thead>
                    <tr>
                        <th class="no-sort">
                            <label class="checkboxs">
                                <input type="checkbox" id="select-all">
                                <span class="checkmarks"></span>
                            </label>
                        </th>
                        <th>Category</th>
                        <!-- <th>Created By</th> -->
                        <th>Status</th>
                        <th *ngIf="role != 'Attendant'" class="no-sort">Action</th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let category of categories">
                        <td>
                            <label class="checkboxs">
                                <input type="checkbox">
                                <span class="checkmarks"></span>
                            </label>
                        </td>
                        <td>{{ category.expense_name }}</td>
                        <td>
                            <span *ngIf="category.status" class="badge badge-linesuccess">Active</span>
                            <span *ngIf="!category.status" class="badge badge-linedanger">Inactive</span>
                        </td>
                        <td *ngIf="role != 'Attendant'" class="action-table-data">
                            <div class="edit-delete-action">
                                <a class="me-2 p-2" href="javascript:void(0);" (click)="categoryClicked(category.id, category.expense_name, category.status)" data-bs-toggle="modal" data-bs-target="#edit-category">
                                    <i data-feather="edit" class="feather-edit"></i>
                                </a>
                                <!-- <a class=" p-2" href="javascript:void(0);"  (click)="categoryClicked(category.id, category.expense_name, category.status)" data-bs-toggle="modal" data-bs-target="#delete-units">
                                    <i data-feather="trash-2" class="feather-trash-2"></i>
                                </a> -->
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<div class="modal fade" id="add-category">
    <div class="modal-dialog modal-dialog-centered custom-modal-two">
        <div class="modal-content">
            <div class="page-wrapper-new p-0">
                <div class="content">
                    <div class="modal-header border-0 custom-modal-header">
                        <div class="page-title">
                            <h4>Create Category</h4>
                        </div>
                        <button type="button" class="close" data-bs-dismiss="modal" aria-label="Close">
                            <span aria-hidden="true">&times;</span>
                        </button>
                    </div>
                    <div class="modal-body custom-modal-body">
                        <form (submit)="createCategoryFunc($event)" [formGroup]="createCategoryFrm">
                            <div class="mb-3">
                                <label class="form-label">Category</label>
                                <input type="text" formControlName="expense_name" class="form-control">
                                <div
                                    *ngIf="createCategoryFrm.get('expense_name')?.invalid && createCategoryFrm.get('expense_name')?.touched">
                                    <div class="forgot-link text-danger" style="font-size: 12px;font-weight: 500;"
                                        *ngIf="createCategoryFrm.get('expense_name')?.errors!['required']">field is required.
                                    </div>
                                </div>
                            </div>
                            <div style="display: flex;justify-content:center;">
                                <app-errormodal></app-errormodal>
                            </div>
                            <div class="mb-0">
                                <div
                                    class="status-toggle modal-status d-flex justify-content-between align-items-center">
                                    <span class="status-label">Status</span>
                                    <input type="checkbox" formControlName="status" id="user2" class="check" checked>
                                    <label for="user2" class="checktoggle"></label>
                                </div>
                            </div>
                            <div class="modal-footer-btn">
                                <button [disabled]="sharedservices.responses.disabled" type="button"
                                    class="btn btn-cancel me-2" data-bs-dismiss="modal">Cancel</button>
                                <button [disabled]="sharedservices.responses.disabled" type="submit"
                                    class="btn btn-submit">Create Category</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>


<div class="modal fade" id="edit-category">
    <div class="modal-dialog modal-dialog-centered custom-modal-two">
        <div class="modal-content">
            <div class="page-wrapper-new p-0">
                <div class="content">
                    <div class="modal-header border-0 custom-modal-header">
                        <div class="page-title">
                            <h4>Edit Category</h4>
                        </div>
                        <button type="button" class="close" data-bs-dismiss="modal" aria-label="Close">
                            <span aria-hidden="true">&times;</span>
                        </button>
                    </div>
                    <div class="modal-body custom-modal-body">
                        <form (submit)="submitUpdateFrm($event)" [formGroup]="updateCategoryFrm">
                            <div class="mb-3">
                                <label class="form-label">Category</label>
                                <input type="text" formControlName="expense_name" class="form-control">
                            </div>
                            <div class="mb-0">
                                <div class="status-toggle modal-status d-flex justify-content-between align-items-center">
                                    <span class="status-label">Status</span>
                                    <input type="checkbox" formControlName="status" id="user3" class="check">
                                    <label for="user3" class="checktoggle"></label>
                                </div>
                            </div>
                            <div style="display: flex;justify-content:center;">
                                <app-errormodal></app-errormodal>
                            </div>
                            <div class="modal-footer-btn">
                                <button [disabled]="sharedservices.responses.disabled" type="button" class="btn btn-cancel me-2"
                                    data-bs-dismiss="modal">Cancel</button>
                                <button [disabled]="sharedservices.responses.disabled" type="submit" class="btn btn-submit">Save Changes</button>
                            </div>

                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="delete-units">
    <div class="modal-dialog modal-dialog-centered custom-modal-two">
        <div class="modal-content">
            <div class="page-wrapper-new p-0">
                <div class="content">
                    <div class="modal-header border-0 custom-modal-header">
                        <div class="page-title">
                            <h4 *ngIf="hide">Delete Category</h4>
                            <h4 *ngIf="!hide">Category deleted</h4>
                        </div>
                        <button type="button" class="close" data-bs-dismiss="modal" aria-label="Close">
                            <span aria-hidden="true">&times;</span>
                        </button>
                    </div>
                    <div class="modal-body custom-modal-body">
                        <div *ngIf="hide"> <h5>Are you sure you want to continue</h5></div>
                        <div style="display: flex;justify-content:center;">
                            <app-errormodal></app-errormodal>
                        </div>
                        <div class="modal-footer-btn">
                            <button [disabled]="sharedservices.responses.disabled"  type="button" class="btn btn-cancel me-2"
                                data-bs-dismiss="modal" (click)="hide=true;">Cancel</button>
                            <button *ngIf="hide" (click)="deleteCategory()" [disabled]="sharedservices.responses.disabled"  type="submit" class="btn btn-danger">Submit</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
